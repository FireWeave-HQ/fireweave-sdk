[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fireweave"
version = "0.1.1"
description = "Fireweave polyglot SDK for Python — server-first control-point evaluation and target registration (spec v0.1.0)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fireweave AI, Inc." }]
keywords = ["feature-flags", "rollout", "release", "control-points"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# Zero runtime dependencies (spec/control-points.md "Scope of v1"): the SDK
# is exactly two capabilities — control-point evaluation and target
# registration — over the standard library only.
dependencies = []

[project.urls]
Homepage = "https://github.com/FireWeave-HQ/fireweave-sdk"
Documentation = "https://github.com/FireWeave-HQ/fireweave-sdk/tree/master/docs"
Repository = "https://github.com/FireWeave-HQ/fireweave-sdk"
Issues = "https://github.com/FireWeave-HQ/fireweave-sdk/issues"
Changelog = "https://github.com/FireWeave-HQ/fireweave-sdk/blob/master/CHANGELOG.md"
"Source" = "https://github.com/FireWeave-HQ/fireweave-sdk/tree/master/sdks/python"

[project.optional-dependencies]
# v1 has no vendor or OpenFeature-provider extras (spec/control-points.md
# "Scope of v1": "MUST NOT expose an OpenFeature provider"). `dev` is the
# only surviving extra, test-tooling only.
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fireweave = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
