# Fireweave polyglot SDK — main CI (GitHub-hosted runners).
#
# Lint/typecheck/test per language (min-supported + latest-stable matrix),
# conformance runners, cross-language differential comparison (fails on
# undeclared divergence), test-server integration smoke, offline examples,
# docs link check, and package build DRY RUNS (artifacts only — publishing is
# hard-disabled everywhere; see release.yml + RELEASE.md).
#
# Runtime policy (ADR-0008): the Node SDK is published as a runtime-agnostic
# ESM package and gated on Node, Bun, and Deno. Node and Bun run the full suite;
# Deno runs a typecheck plus the cross-runtime smoke (see the deno job comment).
#
# Lint policy (matches the code as written — no invented configs):
#   node   : tsc --noEmit only (no eslint/prettier config exists)
#   python : ruff --select F (pyflakes-level; no ruff/black config exists),
#            baseline-gated via tools/lint/check-python.sh
#   go     : gofmt -l + go vet
#   java   : none beyond javac (no checkstyle config exists)
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------- node
  node:
    name: node (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24'] # minimum supported (engines >=20.20) + latest stable LTS
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json
      - name: Install workspace dependencies
        working-directory: sdks/node
        run: npm ci
      # dist/ is gitignored; package exports resolve to dist/, so build before tsc/tests.
      - name: Build SDK (emit dist/ for package exports)
        working-directory: sdks/node
        run: npm run build
      - name: Typecheck (tsc — lint-equivalent; no eslint/prettier configs in repo)
        working-directory: sdks/node
        run: npm run typecheck
      - name: Unit + integration tests
        working-directory: sdks/node
        run: npm test
      - name: Conformance runner (per-version sanity; differential job is the gate)
        working-directory: sdks/node
        run: npm run conformance
      - name: Cross-runtime smoke (Node leg)
        working-directory: sdks/node
        run: node scripts/smoke-runtimes.mjs

  # ---------------------------------------------------------------- bun
  # The published package is runtime-agnostic (ADR-0008). Bun's native test
  # runner does not yet implement node:test (oven-sh/bun#5090), so unit suites
  # stay on the node job; this job builds with the shared tsc script and runs
  # the cross-runtime smoke under Bun.
  bun:
    name: bun (${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.2.0', 'latest'] # minimum supported + current
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install workspace dependencies (npm workspaces for package link)
        working-directory: sdks/node
        run: npm ci
      - name: Build SDK (emit dist/ for package exports)
        working-directory: sdks/node
        run: npm run build
      - name: Cross-runtime smoke (Bun leg)
        working-directory: sdks/node
        run: bun scripts/smoke-runtimes.mjs

  # ---------------------------------------------------------------- deno
  # Deno lacks the Node globals `Buffer` and `process` outside npm compatibility
  # mode, which is why src/ uses TextEncoder and src/env.ts#readEnv instead.
  #
  # The SDK is zero-dependency (no bare npm specifiers anywhere in dist/), so
  # both the typecheck below and the smoke script's deep RELATIVE imports need
  # no npm resolution.
  deno:
    name: deno (${{ matrix.deno }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deno: ['v2.x', 'canary']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno }}
      # dist/ is gitignored and Deno does not run the TypeScript build, so the
      # artifact under test is produced by the Node toolchain first.
      - name: Install workspace dependencies (build toolchain only)
        working-directory: sdks/node
        run: npm ci
      - name: Build SDK (emit dist/ for Deno to consume)
        working-directory: sdks/node
        run: npm run build
      - name: Typecheck the published build under Deno
        working-directory: sdks/node
        run: deno check --no-npm dist/application/client.js dist/infrastructure/adapters/remote.js
      - name: Cross-runtime smoke (Deno leg, least privilege)
        working-directory: sdks/node
        run: deno run --allow-read scripts/smoke-runtimes.mjs
      - name: Cross-runtime smoke (Deno leg, with env access)
        working-directory: sdks/node
        run: deno run --allow-read --allow-env scripts/smoke-runtimes.mjs

  # ---------------------------------------------------------------- web
  # The browser package (ADR-0009). Bun is the ONLY runtime this job uses.
  #
  # That is not a coverage compromise. `@fireweaveai/web-sdk` targets browsers:
  # it ships no server entry point, reads no environment, and imports no runtime
  # built-ins. Node and Deno are not target runtimes, so exercising it on them
  # would assert a property no user depends on. Bun runs the suite and the
  # conformance harness; happy-dom supplies the DOM (bunfig.toml preload).
  #
  # Coverage boundary, stated rather than glossed: happy-dom is a DOM, not a
  # browser. `pagehide` / `visibilitychange` / `keepalive` are exercised for
  # real, but bfcache restore, beacon size limits, and whether a request
  # actually leaves the socket during unload are browser behaviours no headless
  # DOM can assert. If that path proves fragile in practice, the escalation is a
  # small Playwright suite over exactly those invariants.
  web:
    name: web (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Node is present only to run `tsc` for the typecheck step; it never
      # executes the package.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install workspace dependencies
        working-directory: sdks/web
        run: bun install
      - name: Typecheck (src + tests)
        working-directory: sdks/web
        run: bun run typecheck
      - name: Unit tests + browser-portability guard
        working-directory: sdks/web
        run: bun run test
      - name: Web conformance (contracts/web)
        working-directory: sdks/web
        run: bun run conformance

  # ---------------------------------------------------------------- python
  python:
    name: python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14'] # minimum supported + latest stable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install SDK with dev extras + ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './sdks/python[dev]' ruff
      - name: Pyflakes-level lint (ruff --select F, baseline-gated)
        run: bash tools/lint/check-python.sh python
      - name: Pytest (includes the conformance suite, softened for known out-of-scope gaps — see task-10-report.md)
        working-directory: sdks/python
        run: python -m pytest
      # No separate raw-CLI "conformance runner" step here: it would exercise the
      # same 65 fixtures pytest above just ran, but via run_conformance.py's raw
      # exit code, which is non-zero on ANY real fixture divergence — including
      # the documented, out-of-scope ones pytest's xfail wrapper already
      # accounts for (contracts/harness.md rule 5: runners "exit non-zero on any
      # fail" is by design, not a crash signal). The differential job
      # (scripts/conformance-all.sh) is where that raw report is actually
      # produced and consumed, against the honest 65x7 aggregate gate.

  # ---------------------------------------------------------------- go
  go:
    name: go (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.13', 'stable'] # go.mod minimum + latest stable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: sdks/go/go.mod
      - name: gofmt check
        working-directory: sdks/go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt: files need formatting:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        working-directory: sdks/go
        run: go vet ./...
      - name: go build
        working-directory: sdks/go
        run: go build ./...
      - name: go test -race (includes the conformance suite via conformance/harness_test.go, softened for known out-of-scope gaps — see task-10-report.md)
        working-directory: sdks/go
        run: go test -race ./...
      # No separate raw-CLI "conformance runner" step here: it would exercise
      # the same 65 fixtures go test above just ran, but via cmd/conformance's
      # raw exit code, which is non-zero on ANY real fixture divergence —
      # including the documented, out-of-scope ones harness_test.go's t.Skip
      # wrapper already accounts for (contracts/harness.md rule 5: runners
      # "exit non-zero on any fail" is by design, not a crash signal). The
      # differential job (scripts/conformance-all.sh) is where that raw report
      # is actually produced and consumed, against the honest 65x7 aggregate
      # gate.

  # ---------------------------------------------------------------- java
  java:
    name: java (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '25'] # release target (compiler.release=11) + latest LTS
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build + unit tests + conformance JUnit gate
        working-directory: sdks/java
        run: mvn -B -ntp clean install

  # ---------------------------------------------------------------- rust
  rust:
    name: rust (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.75.0', 'stable'] # Cargo.toml rust-version minimum + latest stable
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: cargo fmt check
        working-directory: sdks/rust
        run: cargo fmt --check
      - name: cargo clippy (dependency budget + layering guards are plain #[test]s under this same run)
        working-directory: sdks/rust
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo build --locked
        working-directory: sdks/rust
        run: cargo build --locked
      - name: cargo test --locked (unit + doctests + architecture/surface guards)
        working-directory: sdks/rust
        run: cargo test --locked
      - name: Conformance runner (per-version sanity; differential job is the gate)
        working-directory: sdks/rust
        run: cargo run --locked --bin conformance -- --contracts ../../contracts --out /tmp/compatibility-report.rust.json
      # No separate assertion step on that report's own exit code beyond the
      # command above failing the job: contracts/harness.md rule 5 says a
      # runner "exit non-zero on any fail" is expected on any real
      # divergence, not a crash signal — matching go/java's per-language job
      # comment. The differential job (scripts/conformance-all.sh) is where
      # that report is aggregated against the honest 65x7 cross-language
      # gate.

  # --------------------------------------------------------------- swift
  swift:
    name: swift (${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ['6.0.3', '6.2.1'] # Package.swift swift-tools-version floor + newest patch known to setup-swift@v2
    steps:
      - uses: actions/checkout@v5
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}
      - name: swift-format lint (built-in `swift format`, no separate config)
        working-directory: sdks/swift
        run: find Sources Tests -name '*.swift' | xargs swift format lint --strict
      - name: swift build
        working-directory: sdks/swift
        run: swift build
      - name: swift test (unit + architecture/surface guards)
        working-directory: sdks/swift
        run: swift test
      - name: Conformance runner (per-version sanity; differential job is the gate)
        # No `--` before --contracts: `swift run`'s own arguments are
        # `[<options>] [<executable>] [<arguments>...]` with no `--`
        # convention to strip, and FireweaveConformance's own arg parser
        # (Entry.swift) doesn't special-case one either — a stray `--` here
        # crashes it with `Fatal error: unknown argument --` (verified on
        # both 6.1 and 6.2.1) before it reads a single fixture.
        working-directory: sdks/swift
        run: swift run FireweaveConformance --contracts ../../contracts --out /tmp/compatibility-report.swift.json
      # No separate assertion step on that report's own exit code beyond the
      # command above failing the job: contracts/harness.md rule 5 says a
      # runner "exit non-zero on any fail" is expected on any real
      # divergence, not a crash signal — matching go/java/rust's per-language
      # job comment. The differential job (scripts/conformance-all.sh) is
      # where that report is aggregated against the honest 65x7 cross-
      # language gate.

  # -------------------------------------------- cross-language differential
  differential:
    name: cross-language differential (comparator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v6
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.mod
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: swift-actions/setup-swift@v2
        with:
          # 6.2.1 is the newest patch known to setup-swift@v2 (6.3.x is not listed).
          swift-version: '6.2.1'
      - name: tools/release/version.sh unit tests (pure semver + staging-N logic)
        # Chosen job: this is the one job in ci.yml with node, python, AND
        # java/mvn all set up already (needed for the 65x7 conformance run
        # below) — so version.test.sh's java `apply` case, which SKIPs
        # without `mvn` on PATH, runs for real here instead of skipping.
        # The script's own exit code is this step's exit code (no `|| true`,
        # no continue-on-error) — a regression in the bump/strip/staging-N
        # logic fails this job, not just the local dry run.
        run: bash tools/release/version.test.sh
      - name: Run all six conformance runners + comparator
        run: bash scripts/conformance-all.sh
      - name: Publish comparator summary
        if: always()
        run: |
          if [ -f build/conformance/summary.md ]; then
            cat build/conformance/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload compatibility report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: compatibility-report
          path: build/conformance/
          if-no-files-found: error

  # ---------------------------------------------------------- integration
  integration:
    name: integration (test-server stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json
      - name: Start test-server stub (zero-dep)
        run: |
          node test-server/implementation/server.mjs --port 3901 &
          echo "TEST_SERVER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3901/health >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:3901/health
      - name: Protocol smoke (flags endpoint answers)
        run: |
          code="$(curl -s -o /tmp/flags.json -w '%{http_code}' -X POST 'http://127.0.0.1:3901/flags?v=2' \
            -H 'Content-Type: application/json' \
            -d '{"api_key":"phc_test","distinct_id":"ci-smoke"}')"
          echo "POST /flags -> HTTP $code"
          cat /tmp/flags.json
          test "$code" != "404"
      - name: Node SDK integration tests (exercise the stub protocol via injected fetch)
        working-directory: sdks/node
        run: |
          npm ci
          npm run build
          npm run test:integration
      - name: Stop test-server
        if: always()
        run: kill "$TEST_SERVER_PID" 2>/dev/null || true

  # -------------------------------------------------------------- examples
  examples:
    name: examples (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20' # examples must work at the minimum supported version
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-go@v6
        with:
          go-version-file: examples/go/go.mod
          cache-dependency-path: examples/go/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Build node SDK dist (examples/node consumes it via file:)
        working-directory: sdks/node
        run: |
          npm ci
          npm run build
      - name: Run node example (offline)
        working-directory: examples/node
        run: |
          npm install --no-audit --no-fund
          npm start
      - name: Run python example (offline)
        run: |
          python -m pip install -e './sdks/python'
          cd examples/python
          python service.py
      - name: Run go example (offline)
        working-directory: examples/go
        run: go run .
      - name: Install java SDK modules, run java example (offline)
        run: |
          mvn -B -ntp -f sdks/java/pom.xml -DskipTests install
          mvn -B -ntp -f examples/java/pom.xml compile exec:java

  # ---------------------------------------------------------- package dry runs
  package-dry-run:
    name: package build dry runs (never publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v6
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.mod
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: npm pack / python -m build / go mod verify / mvn package
        run: bash scripts/build-all.sh
      - name: Upload package artifacts (dry run — NOT published)
        uses: actions/upload-artifact@v5
        with:
          name: package-dry-run
          path: build/packages/
          if-no-files-found: error

  # ------------------------------------------------------------- docs links
  docs-links:
    name: docs link check (internal links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # --offline: verify every local file/anchor link in Markdown resolves.
      # External URLs are deliberately not checked in CI (flaky/nondeterministic).
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress --root-dir ${{ github.workspace }} './**/*.md'
          fail: true

  # ----------------------------------------------------------- workflow lint
  actionlint:
    name: actionlint (workflow self-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash)
          ./actionlint -color
