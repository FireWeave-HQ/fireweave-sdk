# Publish the Python SDK (`fireweave`) to PyPI.
#
# Trigger: workflow_dispatch only, with an explicit plain version — a manual
# recovery path for a plain X.Y.Z. Routine releases, production and rc alike,
# go through release.yml (component=python); the `python/v*` tag-push trigger
# is retired, so a pushed tag never publishes.
#
# The dispatched version is APPLIED to pyproject.toml here rather than asserted
# to match it — the committed manifest trails every shipped release because no
# publish job writes the version back. Only plain `X.Y.Z` is accepted: staging
# builds (`X.Y.ZrcN`) publish to PyPI only through release.yml channel=staging.
#
# Auth (prefer token; OIDC optional):
#   - Repository or `release` environment secret: PYPI_API_TOKEN
#     (PyPI → Account settings → API tokens → scoped to project `fireweave`)
#   - Optional: PyPI Trusted Publisher (OIDC) for the same workflow + environment
#     if you later migrate off long-lived tokens. See .github/RELEASE.md.
name: Publish Python SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver WITHOUT leading v (must match sdks/python/pyproject.toml)'
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: build and publish fireweave to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # optional OIDC trusted publishing (token path is primary)
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Resolve release version
        id: ver
        # No publish job writes the applied version back to the repo, so
        # pyproject.toml on master trails every shipped release — an equality
        # assertion between the two can only ever fail. Resolve the version
        # here and APPLY it below, the way publish-java.yml does with
        # versions:set.
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          # This manual path publishes plain versions only. Staging builds
          # (`X.Y.ZrcN`, minted by release.yml channel=staging) go to PyPI
          # through release.yml, never through this workflow.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a plain X.Y.Z release version."
            echo "::error::Staging builds (X.Y.ZrcN) publish to PyPI only through release.yml channel=staging."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing fireweave==$VERSION"

      - name: Apply resolved version to pyproject.toml
        run: tools/release/version.sh apply python "${{ steps.ver.outputs.version }}"

      - name: Require PYPI_API_TOKEN
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${PYPI_API_TOKEN:-}" ]; then
            echo "::error::PYPI_API_TOKEN secret is missing (set on repo or environment 'release')"
            exit 1
          fi

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist/ sdks/python
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
