# Publish the Python SDK (`fireweave`) to PyPI.
#
# Triggers:
#   - push of org tag `python/v<semver>` (e.g. python/v0.1.0), pushed BY A
#     HUMAN. Tags created by release.yml's `tag` job do NOT fire this: GitHub
#     suppresses workflow triggers for refs pushed with the default
#     GITHUB_TOKEN, so a CI-tagged release reaches PyPI only through
#     release.yml's own `channel=production` path. Do not read a green
#     release.yml run as "and then publish-python.yml took it from there".
#   - workflow_dispatch with an explicit version
#
# The resolved version is APPLIED to pyproject.toml here rather than asserted
# to match it — the tag is the release identity, and the committed manifest
# trails every shipped release because no publish job writes the version back.
# Only plain `X.Y.Z` is accepted: `python/v*` also matches the `X.Y.ZaN`
# staging tags, and those belong on TestPyPI.
#
# Auth (prefer token; OIDC optional):
#   - Repository or `release` environment secret: PYPI_API_TOKEN
#     (PyPI → Account settings → API tokens → scoped to project `fireweave`)
#   - Optional: PyPI Trusted Publisher (OIDC) for the same workflow + environment
#     if you later migrate off long-lived tokens. See .github/RELEASE.md.
name: Publish Python SDK

on:
  push:
    tags:
      - 'python/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver WITHOUT leading v (must match sdks/python/pyproject.toml)'
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: build and publish fireweave to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # optional OIDC trusted publishing (token path is primary)
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Resolve release version
        id: ver
        # The tag, not pyproject.toml, is the release identity. No publish job
        # writes the applied version back to the repo, so pyproject.toml on
        # master trails every shipped release — an equality assertion between
        # the two can only ever fail, which is why this workflow's tag path had
        # never once completed. Resolve the version here and APPLY it below,
        # the way publish-java.yml already does with versions:set.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            REF="${GITHUB_REF_NAME}"
            case "$REF" in
              python/v*) VERSION="${REF#python/v}" ;;
              *)
                echo "::error::Unexpected tag '$REF' (expected python/v<semver>)"
                exit 1
                ;;
            esac
          fi
          # pypi.org is the PRODUCTION index. Staging identities (`X.Y.ZaN`,
          # PEP 440 alphas minted by release.yml channel=staging) belong on
          # test.pypi.org and must never reach it through a tag push — the
          # `python/v*` trigger matches those staging tags too.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a plain X.Y.Z release version."
            echo "::error::Staging builds (e.g. 2.3.0a1) go to TestPyPI via release.yml channel=staging, never to pypi.org."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing fireweave==$VERSION"

      - name: Apply resolved version to pyproject.toml
        run: tools/release/version.sh apply python "${{ steps.ver.outputs.version }}"

      - name: Require PYPI_API_TOKEN
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${PYPI_API_TOKEN:-}" ]; then
            echo "::error::PYPI_API_TOKEN secret is missing (set on repo or environment 'release')"
            exit 1
          fi

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist/ sdks/python
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
