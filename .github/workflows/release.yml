# Fireweave polyglot SDK — release automation (workflow_dispatch only).
#
# DRY-RUN BY DEFAULT. Builds, changelogs, SBOMs, checksums; optionally tags.
#
# Inputs: `component` (server|web|python|java|go|rust|swift|all — `all` fans
# out via matrix), `bump` (patch|minor|major — computed from the component's
# OWN current manifest version by tools/release/version.sh; there is no
# free-text `version` input anymore), `channel` (staging|production),
# `dry_run` (default true).
#
# Staging identity is a VERSION SUFFIX, not an npm dist-tag: a staging
# release is `X.Y.Z-staging.N` (N read from the ecosystem's registry by
# tools/release/version.sh — never a local file, so two operators releasing
# from different branches both see the true next N). A dist-tag is a mutable
# pointer — the same bytes can be staging today and production tomorrow, and
# the installed artifact records nothing; a version suffix puts the channel
# in the version itself. npm still needs an explicit `--tag` on every publish
# (it defaults untagged publishes to `latest` regardless of whether the
# version is a prerelease) — staging publishes `--tag next`, production
# would publish `--tag latest`; the tag is now pure syntax to dodge that
# footgun, not the channel signal.
#
# `verify` (build + test + conformance, the full scripts/{build,test,
# conformance}-all.sh suite — see that job's own comment for why it is not
# matrixed per component) sits between build and every publish-* job so a
# release cannot publish without the gates running.
#
# STAGING PUBLISH (authorized 2026-07-27): npm (server) + TestPyPI + Go
# proxy warm are enabled only when dry_run=false AND channel=staging AND the
# matching component is selected. Requires trusted publishers / secrets (see
# RELEASE.md).
#
# STAGING PUBLISH SCOPE EXTENDED (2026-08-21, during this implementation
# work — NOT a separate human authorization; record it as such): npm for
# `web` (identical OIDC trusted-publish mechanism as the already-authorized
# `server`) and a rust `cargo publish --dry-run` (packages + validates only;
# never uploads — see below) were added to the same dry_run=false AND
# channel=staging gate. Flag for a human to backfill an explicit sign-off on
# these two specifically if the 2026-07-27 authorization was meant to be
# read as closed to new components.
#
# rust and swift have no staging registry at all (crates.io has no TestPyPI
# equivalent, and yanking is not deletion — a real staging publish would
# spend the version permanently): rust staging stops at
# `cargo publish --dry-run` plus the git tag; go and swift staging (and
# production) resolve from the git tag alone — for swift there is no publish
# step whatsoever, staging or production.
#
# Production PyPI is enabled via channel=production (component=python) and also
# via the dedicated tag-triggered workflow publish-python.yml (python/v*).
# Maven Central is enabled via channel staging/production (component=java) and
# via publish-java.yml (tag java/v*) — requires Central namespace verification
# plus MAVEN_CENTRAL_* and MAVEN_GPG_* secrets. Missing secrets fail closed.
# rust production (`cargo publish`) requires CARGO_REGISTRY_TOKEN — missing
# fails closed the same way.
# STILL HARD-DISABLED: production npm (dist-tag latest, both server and web)
# until a second written authorization.
#
# Two GitHub environments: `release` (production — keeps the required-
# reviewer gate) and `release-staging` (staging — no reviewer gate; exists so
# a workflow bug can never reach production secrets from a staging run).
# Java is the one exception: Maven Central Portal has no separate staging
# registry or credentials, so publish-maven stays on `environment: release`
# for BOTH channels (autoPublish is what actually differs by channel there)
# — see RELEASE.md.
#
# Tag convention (org): <component>/v<semver>
#   server -> server/v0.1.0   (renamed from `node` — see below)
#   web    -> web/v0.1.0
#   python -> python/v0.1.0
#   java   -> java/v0.1.0
#   rust   -> rust/v0.1.0
#   swift  -> swift/v0.1.0   (chosen to match the org convention; see RELEASE.md
#                             for why a bare `vX.Y.Z` buys nothing here)
#   go     -> sdks/go/v0.1.0   (Go REQUIRES the tag to equal the module
#                               subdirectory path; see RELEASE.md)
#
# `node` -> `server` rename: the npm package is `@fireweaveai/server-sdk`
# (renamed from `@fireweaveai/sdk` in an earlier task); its directory stays
# `sdks/node`. The tag prefix changes from `node/v` to `server/v`. This
# component has never published (`git tag` is empty and the npm registry
# 404s on `@fireweaveai/server-sdk`), so no historical tag breaks.
name: Release (dry-run by default)

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'SDK component to release ("all" fans out via matrix)'
        required: true
        type: choice
        options: [server, web, python, java, go, rust, swift, all]
      bump:
        description: 'Semver bump, applied to the component''s OWN current manifest version (any existing prerelease is stripped first)'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      channel:
        description: 'Distribution channel (staging = version suffix -staging.N / TestPyPI / cargo --dry-run / Maven staging)'
        required: true
        type: choice
        options: [staging, production]
        default: staging
      dry_run:
        description: 'Dry run (no tag push, no attestation, no staging/production publish). Set false only after trusted publishers are configured.'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: validate inputs
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.compute.outputs.components }}
    steps:
      - name: Resolve component matrix
        id: compute
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          if [ "$COMPONENT" = all ]; then
            COMPONENTS='["server","web","python","java","go","rust","swift"]'
          else
            COMPONENTS="[\"$COMPONENT\"]"
          fi
          echo "components=$COMPONENTS" >> "$GITHUB_OUTPUT"
          echo "Releasing bump=${{ inputs.bump }} channel=${{ inputs.channel }} dry_run=${{ inputs.dry_run }} components=$COMPONENTS"

  build:
    name: build, changelog, SBOM, checksums (${{ matrix.component }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.validate.outputs.components) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write      # tag push (gated on dry_run == false)
      id-token: write      # build provenance attestation
      attestations: write  # build provenance attestation
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for changelog + tag ancestry
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v6
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compute release version
        id: version
        run: |
          tools/release/version.sh compute "${{ matrix.component }}" "${{ inputs.bump }}" "${{ inputs.channel }}" \
            | tee release-info.env >> "$GITHUB_OUTPUT"

      - name: Upload computed release info (consumed by the matching publish-* job)
        uses: actions/upload-artifact@v5
        with:
          name: release-info-${{ matrix.component }}
          path: release-info.env
          if-no-files-found: error

      - name: Build all package artifacts (dry-run packaging + SHA256SUMS)
        # NOT scoped to matrix.component: scripts/build-all.sh has always
        # packaged every node/python/go/java artifact regardless of which
        # single component a release targets (same script CI's own
        # package-dry-run job runs) — left as-is here rather than reinvented.
        # Two pre-existing, out-of-scope-for-this-task consequences, noted
        # in task-14-report.md: (1) it does not package rust or swift at all
        # (rust's own release-worthy "build" step is `cargo publish
        # --dry-run` in publish-cargo instead; swift has no packaging step,
        # ever — see the header comment); (2) on an `all` component fan-out
        # this reruns the full 4-ecosystem build once per matrix leg.
        run: bash scripts/build-all.sh

      - name: Generate conventional-commits changelog
        run: |
          bash tools/release/changelog.sh "${{ matrix.component }}" "${{ steps.version.outputs.release_version }}" \
            "build/packages/CHANGELOG-${{ matrix.component }}-v${{ steps.version.outputs.release_version }}.md"
          cat "build/packages/CHANGELOG-${{ matrix.component }}-v${{ steps.version.outputs.release_version }}.md" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Generate SBOM (syft via anchore/sbom-action)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: build/packages/sbom-${{ matrix.component }}-v${{ steps.version.outputs.release_version }}.spdx.json
          upload-artifact: false

      - name: Refresh checksums (includes changelog + SBOM)
        working-directory: build/packages
        run: |
          : > SHA256SUMS
          for f in *; do
            [ "$f" = "SHA256SUMS" ] && continue
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Attest build provenance (skipped in dry runs)
        # Requires repo setting "Allow GitHub Actions to create attestations"
        # (see RELEASE.md provisioning). Dry runs skip so the workflow works
        # before provisioning is complete.
        if: ${{ inputs.dry_run == false }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            build/packages/*.tgz
            build/packages/*.whl
            build/packages/*.tar.gz
            build/packages/*.jar

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.component }}-v${{ steps.version.outputs.release_version }}-${{ inputs.channel }}
          path: build/packages/
          if-no-files-found: error

      - name: Create + push tag (skipped in dry runs)
        # NOTE ON SIGNED TAGS: GitHub-hosted runners have no org signing key.
        # Org convention is a SIGNED annotated tag; until a signing identity is
        # provisioned (RELEASE.md "Signed tags"), the release owner should
        # re-create this tag locally with `git tag -s` or enable gitsign here.
        if: ${{ inputs.dry_run == false }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "fireweave-release-bot"
          git config user.email "releases@fireweave.ai"
          git tag -a "$TAG" -m "Release ${TAG} (channel: ${{ inputs.channel }})"
          git push origin "refs/tags/${TAG}"

  # =========================================================================
  # VERIFY — the gate the plan calls out as missing: "today a release can
  # publish without running the gates." Runs build + test + conformance for
  # EVERY language via the existing scripts/{build,test,conformance}-all.sh
  # entry points (the same ones a human runs locally per RELEASE.md), rather
  # than reinventing a component-scoped variant of them.
  #
  # Deliberately NOT matrixed over component: all three scripts already test
  # every ecosystem in one pass (conformance-all.sh in particular is the
  # 65x7 cross-language differential gate — it means nothing run against a
  # single language). Matrixing this job would just rerun the identical
  # full-repo suite once per selected component for no additional coverage.
  # It runs once per dispatch — including dry runs — so a dry run also
  # proves the gates are green, not only a real publish attempt.
  # =========================================================================
  verify:
    name: verify (build + test + conformance — full suite, all languages)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v6
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.3.3'

      - name: Build all package artifacts (dry-run)
        run: bash scripts/build-all.sh
      - name: Run the full test suite (node/python/go/java + offline examples)
        run: bash scripts/test-all.sh
      - name: Cross-language conformance (65x7 differential gate)
        run: bash scripts/conformance-all.sh
      - name: Publish comparator summary
        if: always()
        run: |
          if [ -f build/conformance/summary.md ]; then
            cat build/conformance/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  # =========================================================================
  # PUBLISHING
  # - Staging (authorized): npm (server + web) + TestPyPI + rust
  #   `cargo publish --dry-run` + Go proxy warm when dry_run=false and
  #   channel=staging. Requires trusted publishers / secrets (RELEASE.md).
  # - Production npm: HARD-DISABLED (if: false) until a second written
  #   authorization (both server and web).
  # - Production PyPI / Maven / crates.io: gated on channel=production,
  #   dry_run=false, and the matching secret — missing secrets fail closed.
  # - go / swift: no publish job beyond the tag `build` already pushed —
  #   both ecosystems resolve purely from git tags, for staging AND
  #   production (go additionally gets an optional proxy warm on staging).
  #
  # Every job below downloads its own release-info-<component> artifact
  # (uploaded by build's matching matrix leg) instead of recomputing the
  # version: build already queried the registry once; a publish job
  # re-querying afterwards would — for go/java/swift specifically, whose
  # "registry" is the git tag list itself — see the tag `build` just pushed
  # and double-count. Reusing the one computed value sidesteps that for
  # every ecosystem uniformly.
  # =========================================================================

  publish-npm:
    name: publish npm (staging → server-sdk, dist-tag next)
    needs: [validate, build, verify]
    if: ${{ inputs.dry_run == false && inputs.channel == 'staging' && contains(fromJson(needs.validate.outputs.components), 'server') }}
    runs-on: ubuntu-latest
    environment: release-staging
    permissions:
      id-token: write # npm OIDC trusted publishing — no NPM_TOKEN secret needed once provisioned
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release-info-server
          path: release-info
      - name: Load computed release version
        id: version
        run: cat release-info/release-info.env >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Assert OIDC preconditions
        run: |
          echo "npm version: $(npm --version)"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC id-token request vars absent — configure npm Trusted Publisher and permissions.id-token: write"
            exit 1
          fi
      - name: Apply computed version
        run: tools/release/version.sh apply server "${{ steps.version.outputs.release_version }}"
      - name: Build and publish @fireweaveai/server-sdk
        working-directory: sdks/node
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          npm install -g npm@latest
          npm ci
          npm run build
          npm publish --provenance --access public --tag "$DIST_TAG"

  publish-npm-web:
    name: publish npm (staging → web-sdk, dist-tag next)
    needs: [validate, build, verify]
    if: ${{ inputs.dry_run == false && inputs.channel == 'staging' && contains(fromJson(needs.validate.outputs.components), 'web') }}
    runs-on: ubuntu-latest
    environment: release-staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release-info-web
          path: release-info
      - name: Load computed release version
        id: version
        run: cat release-info/release-info.env >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Assert OIDC preconditions
        run: |
          echo "npm version: $(npm --version)"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC id-token request vars absent — configure npm Trusted Publisher and permissions.id-token: write"
            exit 1
          fi
      - name: Apply computed version
        run: tools/release/version.sh apply web "${{ steps.version.outputs.release_version }}"
      - name: Build and publish @fireweaveai/web-sdk
        working-directory: sdks/web
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          npm install -g npm@latest
          npm ci
          npm run build
          npm publish --provenance --access public --tag "$DIST_TAG"

  publish-npm-production:
    name: publish npm production (HARD-DISABLED)
    needs: [validate, build, verify]
    if: ${{ false }} # HARD-DISABLED — second authorization required for dist-tag latest (server-sdk AND web-sdk)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - run: echo "production npm publish (server-sdk, web-sdk) is hard-disabled"

  publish-pypi:
    name: publish TestPyPI (staging)
    needs: [validate, build, verify]
    if: ${{ inputs.dry_run == false && inputs.channel == 'staging' && contains(fromJson(needs.validate.outputs.components), 'python') }}
    runs-on: ubuntu-latest
    environment: release-staging
    permissions:
      id-token: write # optional OIDC; token path uses TEST_PYPI_API_TOKEN
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release-info-python
          path: release-info
      - name: Load computed release version
        id: version
        run: cat release-info/release-info.env >> "$GITHUB_OUTPUT"
      - name: Require TEST_PYPI_API_TOKEN
        env:
          TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          if [ -z "${TEST_PYPI_API_TOKEN:-}" ]; then
            echo "::error::TEST_PYPI_API_TOKEN secret is missing (set on environment 'release-staging')"
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Apply computed version
        run: tools/release/version.sh apply python "${{ steps.version.outputs.release_version }}"
      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build --outdir dist/ sdks/python
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

  publish-pypi-production:
    name: publish PyPI (production)
    needs: [validate, build, verify]
    if: ${{ inputs.dry_run == false && inputs.channel == 'production' && contains(fromJson(needs.validate.outputs.components), 'python') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # optional OIDC; token path uses PYPI_API_TOKEN
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release-info-python
          path: release-info
      - name: Load computed release version
        id: version
        run: cat release-info/release-info.env >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Apply computed version
        run: tools/release/version.sh apply python "${{ steps.version.outputs.release_version }}"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist/ sdks/python
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true

  publish-maven:
    name: publish Maven Central (Central Publisher Portal)
    needs: [validate, build, verify]
    if: ${{ inputs.dry_run == false && contains(fromJson(needs.validate.outputs.components), 'java') }}
    runs-on: ubuntu-latest
    # Stays on `release` for BOTH channels: Maven Central Portal has no
    # separate staging registry or credential set (autoPublish=false is what
    # makes a staging deploy non-final, not a different secret) — see
    # RELEASE.md and the header comment above.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release-info-java
          path: release-info
      - name: Load computed release version
        id: version
        run: cat release-info/release-info.env >> "$GITHUB_OUTPUT"
      - name: Require Central + GPG secrets
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          missing=0
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_GPG_PRIVATE_KEY MAVEN_GPG_PASSPHRASE; do
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then
              echo "::error::$name secret is missing"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Java publication blocked: Central namespace/credentials/GPG not provisioned."
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Run Java tests (against the pre-bump committed version)
        working-directory: sdks/java
        run: mvn -B -ntp clean test
      - name: Apply computed version
        # tools/release/version.sh apply's java branch IS this mvn versions:set
        # call (same command, -q instead of -B -ntp) — calling it here instead
        # of repeating the invocation inline keeps one implementation of "how
        # java's manifest gets written," exercised by version.test.sh.
        run: tools/release/version.sh apply java "${{ steps.version.outputs.release_version }}"
      - name: Sign + deploy
        working-directory: sdks/java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          if [ "${{ inputs.channel }}" = "production" ]; then AUTO=true; else AUTO=false; fi
          mvn -B -ntp -Prelease -DskipTests deploy \
            -Dcentral.autoPublish="$AUTO" \
            -Dcentral.waitUntil=validated

  publish-go:
    name: warm Go module proxy (staging)
    needs: [validate, build, verify]
    if: ${{ inputs.dry_run == false && inputs.channel == 'staging' && contains(fromJson(needs.validate.outputs.components), 'go') }}
    runs-on: ubuntu-latest
    environment: release-staging
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-info-go
          path: release-info
      - name: Load computed release version
        id: version
        run: cat release-info/release-info.env >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Warm proxy.golang.org for the new version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          VERSION="${TAG#sdks/go/}"
          GOPROXY=proxy.golang.org \
            go list -m "github.com/FireWeave-HQ/fireweave-sdk/sdks/go@${VERSION}"

  publish-cargo:
    name: cargo publish --dry-run (staging — no crates.io upload)
    needs: [validate, build, verify]
    if: ${{ inputs.dry_run == false && inputs.channel == 'staging' && contains(fromJson(needs.validate.outputs.components), 'rust') }}
    runs-on: ubuntu-latest
    environment: release-staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release-info-rust
          path: release-info
      - name: Load computed release version
        id: version
        run: cat release-info/release-info.env >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Apply computed version
        run: tools/release/version.sh apply rust "${{ steps.version.outputs.release_version }}"
      - name: cargo publish --dry-run (packages + validates only — never uploads)
        # No staging registry exists for crates.io (unlike TestPyPI) and
        # yanking is not deletion, so a real staging publish would spend the
        # version permanently. --dry-run proves the package is publishable
        # without spending anything; the git tag (already pushed by `build`)
        # IS this release's staging artifact.
        working-directory: sdks/rust
        run: cargo publish --dry-run --locked

  publish-cargo-production:
    name: publish crates.io (production)
    needs: [validate, build, verify]
    if: ${{ inputs.dry_run == false && inputs.channel == 'production' && contains(fromJson(needs.validate.outputs.components), 'rust') }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release-info-rust
          path: release-info
      - name: Load computed release version
        id: version
        run: cat release-info/release-info.env >> "$GITHUB_OUTPUT"
      - name: Require CARGO_REGISTRY_TOKEN
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is missing (set on environment 'release')"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Apply computed version
        run: tools/release/version.sh apply rust "${{ steps.version.outputs.release_version }}"
      - name: Publish to crates.io
        working-directory: sdks/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
