# Deno's nightly build. Not part of pull-request CI: a broken nightly would
# fail every pull request with no change in this repo. Deno 2.x stays in ci.yml.
name: Deno canary

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deno-canary:
    name: deno (canary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: canary
      - name: Install workspace dependencies (build toolchain only)
        working-directory: sdks/node
        run: npm ci
      - name: Build SDK (emit dist/ for Deno to consume)
        working-directory: sdks/node
        run: npm run build
      - name: Typecheck the published build under Deno
        working-directory: sdks/node
        run: |
          cp -R dist "$RUNNER_TEMP/fireweave-dist"
          cd "$RUNNER_TEMP/fireweave-dist"
          deno check --no-npm application/client.js infrastructure/adapters/remote.js
      - name: Cross-runtime smoke (Deno leg, least privilege)
        working-directory: sdks/node
        run: deno run --allow-read scripts/smoke-runtimes.mjs
      - name: Cross-runtime smoke (Deno leg, with env access)
        working-directory: sdks/node
        run: deno run --allow-read --allow-env scripts/smoke-runtimes.mjs
