# Publish Java SDK modules to Maven Central (Central Publisher Portal).
#
# Triggers:
#   - push of org tag `java/v<semver>` (e.g. java/v0.1.0)
#   - workflow_dispatch with an explicit version (applied via versions:set)
#
# Never runs on pull requests.
#
# Required GitHub secrets (repo or `release` environment):
#   MAVEN_CENTRAL_USERNAME  — Central Portal user token username
#   MAVEN_CENTRAL_PASSWORD  — Central Portal user token password
#   MAVEN_GPG_PRIVATE_KEY   — armored private key
#   MAVEN_GPG_PASSPHRASE    — key passphrase
#
# Do not log these values. Namespace `ai.fireweave` must be verified on
# https://central.sonatype.com/ before the first upload can succeed.
name: Publish Java SDK

on:
  push:
    tags:
      - 'java/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver WITHOUT leading v (e.g. 0.1.0). SNAPSHOT is stripped/replaced.'
        required: true
        type: string
      auto_publish:
        description: 'If true, auto-release the Central deployment after validation'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: test, sign, and publish to Maven Central
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            REF="${GITHUB_REF_NAME}"
            case "$REF" in
              java/v*) VERSION="${REF#java/v}" ;;
              *)
                echo "::error::Unexpected tag '$REF' (expected java/v<semver>)"
                exit 1
                ;;
            esac
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::version '$VERSION' is not valid semver"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing ai.fireweave:*:$VERSION"

      - name: Require Central + GPG secrets
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          missing=0
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_GPG_PRIVATE_KEY MAVEN_GPG_PASSPHRASE; do
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then
              echo "::error::$name secret is missing (set on repo or environment 'release')"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Maven Central publication is blocked until namespace verification and secrets are provisioned. See docs/java-parity-plan.md and .github/RELEASE.md."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # JDK 21 to run maven-javadoc-plugin 3.11+; bytecode stays 11 via maven.compiler.release.
          java-version: '21'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Run Java tests
        working-directory: sdks/java
        run: mvn -B -ntp clean test

      - name: Run Java conformance
        run: |
          mvn -B -ntp -f sdks/java/pom.xml -DskipTests install
          mvn -B -ntp -f sdks/java/pom.xml -pl fireweave-testing exec:java \
            -Dexec.args="${GITHUB_WORKSPACE}/contracts ${GITHUB_WORKSPACE}/build/conformance/compatibility-report.java.json"

      - name: Verify Central-required POM metadata
        working-directory: sdks/java
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          def text(el, path):
              n = el.find(path, ns)
              return (n.text or "").strip() if n is not None and n.text else ""
          parent = ET.parse("pom.xml").getroot()
          required_parent = {
              "url": text(parent, "m:url"),
              "license": text(parent, "m:licenses/m:license/m:name"),
              "scm": text(parent, "m:scm/m:url"),
              "developer": text(parent, "m:developers/m:developer/m:name"),
          }
          missing = [k for k, v in required_parent.items() if not v]
          if missing:
              raise SystemExit(f"parent POM missing Central metadata: {missing}")
          for pom in sorted(Path(".").glob("*/pom.xml")):
              root = ET.parse(pom).getroot()
              for field in ("name", "description", "url"):
                  if not text(root, f"m:{field}"):
                      raise SystemExit(f"{pom}: missing <{field}>")
          print("POM metadata OK")
          PY

      - name: Verify license metadata
        working-directory: sdks/java
        run: |
          mvn -B -ntp org.codehaus.mojo:license-maven-plugin:2.4.0:aggregate-add-third-party \
            -Dlicense.excludedScopes=test \
            -Dlicense.failOnMissing=true

      - name: Dependency vulnerability audit
        working-directory: sdks/java
        run: mvn -B -ntp org.sonatype.ossindex.maven:ossindex-maven-plugin:3.2.0:audit

      - name: Set release version
        working-directory: sdks/java
        run: mvn -B -ntp versions:set -DnewVersion="${{ steps.ver.outputs.version }}" -DgenerateBackupPoms=false

      - name: Build sources + javadocs and deploy to Central Portal
        working-directory: sdks/java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          AUTO=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            AUTO="${{ inputs.auto_publish }}"
          else
            AUTO=true
          fi
          mvn -B -ntp -Prelease -DskipTests deploy \
            -Dcentral.autoPublish="$AUTO" \
            -Dcentral.waitUntil=validated

      - name: List published coordinates
        run: |
          echo "Published (or staged) ai.fireweave:fireweave-sdk:${{ steps.ver.outputs.version }}"
          echo "Also: fireweave-openfeature, fireweave-adapter-posthog, fireweave-testing, fireweave-java-parent"
          echo "Portal: https://central.sonatype.com/publishing"
